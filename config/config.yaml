samples:
  - name: CT22
    asm_fa: data/PrimateTestisData/asm/GCA_965153165.1.fa.gz
    reads: [
      data/PrimateTestisData/reads/ERR14376368.bam
    ]

output_dir: "results"
logs_dir: "logs"
benchmarks_dir: "benchmarks"

# Align reads to DSA
align:
  # See https://github.com/logsdon-lab/Snakemake-Aligner
  threads_aln: 8
  mem_aln: 80G
  aligner: "minimap2"
  # See preset options
  # https://lh3.github.io/minimap2/minimap2.html
  aligner_opts: "--eqx -ax map-hifi -I 8G"
  # Omit unmapped reads. This is the inverse flag -F of samtools view.
  # This param could probably be named better
  # See here for flags
  # https://broadinstitute.github.io/picard/explain-flags.html
  samtools_view_flag: 4
  # Don't delete merged assembly.
  temp_asm: False

call_variants:
  threads_deepvariant: 32
  mem_deepvariant: 100G
  threads_sniffles: 8
  mem_sniffles: 40G
  threads_hiphase: 8
  mem_hiphase: 40G

# # Annotate repeats (RepeatMasker) and SDs (biser)
# annot:
#   threads_rm: 2
#   mem_rm: 8G
#   # RepeatMasker species
#   engine_rm: rmblast
#   species_rm: primates
#   # biser settings
#   threads_biser: 4
#   mem_biser: 300G

liftover:
  threads_aln: 8
  mem_aln: 120G
  reference: 
    path: data/PrimateTestisData/asm/mPanTro3.analysis-dip.20231122.fasta.gz
    name: mPanTro3
  annot:
    genes: /scratch/ucgd/lustre-labs/vollger/users/Keith/EldeLabRotation/data/annot/human/chm13v2.0_RefSeq_Liftoff_v5.3.gff
    sd: /scratch/ucgd/lustre-labs/vollger/users/Keith/EldeLabRotation/data/annot/human/segDups_2024.bed
  mm2_opts: "-x asm20 --secondary=no -s 25000 -K 8G"
