channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python file parsing
  - python==3.12
  - polars>=1.44.2,<2
  - pyfaidx
  # General sequence analysis tools
  - samtools
  - seqkit
  - bedtools
  # Call variants
  - pbsv==2.11.0
  - hiphase==1.7.0
  # Liftover
  - ucsc-liftover
  - paf2chain
  - minimap2==2.28
  - miniprot
  - pip
  - pip:
    - lifton>=1.0.10
    - pymafft
