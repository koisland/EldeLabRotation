[workspace]
channels = ["conda-forge", "https://conda.anaconda.org/bioconda"]
name = "sperm_breakpoint"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
fmt = "snakefmt . && ruff format ."

[dependencies]
snakemake = { version = ">=9.26.1,<10", channel = "bioconda" }
snakefmt = { version = ">=2.0.3,<3", channel = "bioconda" }
snakemake-executor-plugin-slurm = ">=2.8.0,<3"
conda = "*"
ruff = "*"
samtools = { version = ">=1.24,<2", channel = "bioconda" }
bigtools = ">=0.5.8,<0.6"
seqkit = ">=2.13.0,<3"
repeatmasker = "==4.1.2.p1"
blast = { version = ">=2.16.0,<3", channel = "bioconda" }
python = ">=3.14.7,<3.15"
minimap2 = "==2.28"
polars = ">=1.44.2,<2"
pbsim3 = ">=3.0.5,<4"
rustybam = ">=0.2.2,<0.3"
matplotlib-base = ">=3.11.2,<4"

[pypi-dependencies]
pysam = ">=0.24.1, <0.25"
